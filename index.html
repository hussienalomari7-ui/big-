<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Data (Part 2) — 60-Question Deep Conceptual Exam Lab</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #263449;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --green-bg: rgba(16, 185, 129, 0.16);
      --green-border: #10b981;
      --green-text: #6ee7b7;
      --red-bg: rgba(239, 68, 68, 0.16);
      --red-border: #ef4444;
      --red-text: #fca5a5;
      --badge-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .title-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .title-area p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .stat-pill.correct {
      border-color: var(--green-border);
      color: var(--green-text);
    }

    .stat-pill.wrong {
      border-color: var(--red-border);
      color: var(--red-text);
    }

    .btn {
      background: var(--accent-dark);
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .chip {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .chip.active, .chip:hover {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    .search-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .q-card.answered-correct {
      border-left: 5px solid var(--green-border);
    }

    .q-card.answered-wrong {
      border-left: 5px solid var(--red-border);
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .badge.slide {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.35);
    }

    .badge.type {
      color: #c084fc;
      border-color: rgba(192, 132, 252, 0.35);
    }

    .q-text {
      font-size: 1.04rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f1f5f9;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 0.94rem;
      line-height: 1.5;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) {
      background: var(--card-hover);
      border-color: var(--accent);
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      min-width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .opt-btn.correct-choice {
      background: var(--green-bg) !important;
      border-color: var(--green-border) !important;
      color: #ecfdf5 !important;
    }

    .opt-btn.correct-choice .opt-letter {
      background: var(--green-border);
      border-color: var(--green-border);
      color: #064e3b;
    }

    .opt-btn.wrong-choice {
      background: var(--red-bg) !important;
      border-color: var(--red-border) !important;
      color: #fef2f2 !important;
    }

    .opt-btn.wrong-choice .opt-letter {
      background: var(--red-border);
      border-color: var(--red-border);
      color: #fff;
    }

    .explanation-box {
      margin-top: 16px;
      padding: 15px 18px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      color: #cbd5e1;
      display: none;
    }

    .explanation-box.visible {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.86rem;
    }

    .exp-header.pass {
      color: var(--green-text);
    }

    .exp-header.fail {
      color: var(--red-text);
    }

    .retry-mini {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .retry-mini:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    code {
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="title-area">
        <h1>Big Data (Part 2) — Deep Conceptual Exam Lab</h1>
        <p>60 Analytical & Scenario-Based Questions • Covers All 28 Slides (HDFS, MapReduce, Spark & RDDs)</p>
      </div>
      <div class="stats-bar">
        <span class="stat-pill" id="stat-progress">Answered: 0 / 60</span>
        <span class="stat-pill correct" id="stat-correct">Correct: 0</span>
        <span class="stat-pill wrong" id="stat-wrong">Wrong: 0</span>
        <span class="stat-pill" id="stat-score">Score: 0%</span>
        <button class="btn btn-outline" onclick="resetAll()">Reset Lab</button>
        <button class="btn" onclick="downloadHTML()">Download HTML</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchBox" class="search-input" placeholder="Search concepts (e.g., InputSplit, Shuffle, Driver, Executor, local[4], Disk Spilling, Lazy Evaluation, reduceByKey, Mahout)..." oninput="renderQuestions()" />
      <div class="filter-row" id="topicFilters">
        <span class="filter-label">Topic:</span>
        <button class="chip active" onclick="setTopic('ALL', this)">All 60 Questions</button>
        <button class="chip" onclick="setTopic('MapReduce SUM & HDFS Blocks', this)">MapReduce SUM & Blocks (Slides 1–9)</button>
        <button class="chip" onclick="setTopic('Spark Roles, Driver & local[4]', this)">Spark Roles & local[4] (Slides 10–14)</button>
        <button class="chip" onclick="setTopic('Memory, Spilling & Lazy Eval', this)">Memory & Lazy Eval (Slides 15–17)</button>
        <button class="chip" onclick="setTopic('RDDs, DataFrames & Partitions', this)">RDDs & Partitions (Slides 18–20)</button>
        <button class="chip" onclick="setTopic('reduceByKey, SQL & Unified Engine', this)">reduceByKey, SQL & Unified Spark (Slides 21–28)</button>
      </div>
      <div class="filter-row" id="statusFilters">
        <span class="filter-label">Filter:</span>
        <button class="chip active" onclick="setStatus('ALL', this)">All Statuses</button>
        <button class="chip" onclick="setStatus('UNANSWERED', this)">Unanswered</button>
        <button class="chip" onclick="setStatus('WRONG', this)">Incorrect Only</button>
        <button class="chip" onclick="setStatus('FALSE_STMT', this)">"Identify the FALSE Statement" Questions</button>
      </div>
    </div>

    <div id="questionsContainer"></div>
  </div>

  <script>
    const questions = [
      // Q1 - Q4: ans 1, 2, 0, 3
      {
        id: 1,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slides 1 & 2",
        type: "Conceptual Analysis",
        q: "In Slide 2 ('MapReduce SUM: The Complete Sales File'), the file sales.csv contains 6 rows of individual sales in JOD across Irbid (100, 50, 30) and Amman (200, 80, 20). Conceptually, what two logical operations are required to answer 'What is the total sales amount for each city?'",
        options: [
          "Sort the file alphabetically by city name and select only the first row for each city.",
          "Group the records by City, and then add the Sales values within each city (producing Irbid: 180 JOD and Amman: 300 JOD).",
          "Sum all six numbers into a single grand total of 480 JOD and divide equally by the number of cities.",
          "Overwrite the original sales.csv file on disk by replacing individual transaction rows with average city values."
        ],
        ans: 1,
        exp: "Slide 2 defines the exact logical problem: 'Group by City. Add the Sales values within each city' to obtain Irbid: 180 JOD (100 + 50 + 30) and Amman: 300 JOD (200 + 80 + 20)."
      },
      {
        id: 2,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slide 3",
        type: "Architectural Reasoning",
        q: "In Slide 3 ('MapReduce SUM: Data in HDFS'), Block 1 is shown on Machine A, Block 2 on Machine B, and Block 3 on Machine C, with a note stating: '3 blocks. Extra replicas exist on these machines for fault tolerance.' Why don't those extra replicas cause the MapReduce job to double-count or triple-count the sales totals?",
        options: [
          "Because HDFS automatically deletes all extra replicas before a MapReduce job starts and recreates them afterward.",
          "Because the Reduce phase divides the final sum by the replication factor to cancel out duplicate blocks.",
          "Because extra replicas exist strictly for fault tolerance if a machine fails; each logical block is processed only once via its assigned InputSplit.",
          "Because extra replicas only store the column headers (City, Sales) rather than the actual numeric JOD values."
        ],
        ans: 2,
        exp: "Slides 3 & 4 explain that HDFS stores 3 blocks with extra replicas for fault tolerance, while 'One Map task reads the records assigned by one InputSplit' (where 1 logical block corresponds to 1 split in the example)."
      },
      {
        id: 3,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slides 3 & 4",
        type: "Identify the FALSE Statement",
        q: "Which of the following statements regarding HDFS Blocks and InputSplits in the MapReduce SUM example (Slides 3 & 4) is FALSE?",
        options: [
          "An InputSplit is a physical backup copy of a file written to disk to replace failed hard drives.",
          "An HDFS Block stores part of a file physically on disk across DataNodes.",
          "An InputSplit describes the input records assigned to a single Map task.",
          "In the course's sales.csv example, 1 HDFS block corresponds to 1 InputSplit."
        ],
        ans: 0,
        exp: "Slide 4 distinguishes the storage concept from the processing concept: 'HDFS Block: Stores part of a file on disk' whereas 'InputSplit: Describes the input for a Map task.'"
      },
      {
        id: 4,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slide 4",
        type: "Deep Comparison",
        q: "Why does the Hadoop architecture distinguish between an 'HDFS Block' and an 'InputSplit' (Slide 4) rather than using a single term for both?",
        options: [
          "Because HDFS Blocks only exist in Apache Spark, whereas InputSplits only exist in Spark SQL.",
          "Because HDFS Blocks are stored in RAM, whereas InputSplits are permanently archived in cloud storage.",
          "Because an HDFS Block can only hold Amman records, whereas an InputSplit can only hold Irbid records.",
          "Because an HDFS Block is a storage-level unit ('stores part of a file on disk'), whereas an InputSplit is a processing-level assignment ('describes the input for a Map task')."
        ],
        ans: 3,
        exp: "Slide 4 highlights this exact separation of concerns: an HDFS Block 'Stores part of a file on disk', while an InputSplit 'Describes the input for a Map task. One Map task reads the records assigned by one InputSplit.'"
      },

      // Q5 - Q8: ans 2, 0, 3, 1
      {
        id: 5,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slides 4 & 5",
        type: "Scenario Analysis",
        q: "In Slide 5 ('Map: Keep the City and Sale Value'), InputSplit 1 contains 'Irbid, 100' and 'Amman, 200'. What is the exact role of Map 1 when processing InputSplit 1?",
        options: [
          "Map 1 adds 100 and 200 together to emit a single combined pair (Total, 300).",
          "Map 1 connects over the network to Machine B and Machine C to fetch the remaining Irbid records before emitting anything.",
          "Map 1 reads the records assigned by InputSplit 1 and emits a (city, sale amount) key-value pair for each record: (Irbid, 100) and (Amman, 200).",
          "Map 1 filters out Amman records and only emits Irbid records so that only one reducer is needed."
        ],
        ans: 2,
        exp: "Slide 5 states: 'Each Map task emits (city, sale amount).' Thus Map 1 reads InputSplit 1 and emits (Irbid, 100) and (Amman, 200)."
      },
      {
        id: 6,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slides 5 & 6",
        type: "Architectural Reasoning",
        q: "After Map 1, Map 2, and Map 3 finish executing on their respective splits (Slide 5), why can't Map 1 immediately output the final total sales for Irbid?",
        options: [
          "Because Map 1 only sees the records in InputSplit 1 (Irbid: 100), while the other Irbid contributions (Irbid: 50 in Map 2 and Irbid: 30 in Map 3) were processed independently by other Map tasks.",
          "Because Map tasks are not allowed to read numeric values and can only read city names.",
          "Because the final sales totals must be calculated by the HDFS NameNode before Map 1 starts.",
          "Because Map 1 stores its output in a Spark DataFrame that requires a SQL GROUP BY query."
        ],
        ans: 0,
        exp: "Slide 6 ('Why Do We Need Shuffle?') shows that Irbid's sales are scattered across Map 1 (Irbid: 100), Map 2 (Irbid: 50), and Map 3 (Irbid: 30). Shuffle is needed to bring the contributions for the same key together."
      },
      {
        id: 7,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slides 6 & 7",
        type: "Pipeline Tracing",
        q: "In Slide 7 ('Shuffle: Group Values by City'), what is the exact input to the Shuffle stage, what is its grouped output, and what placement rule does it enforce?",
        options: [
          "Input: raw CSV files on disk; Output: 3 InputSplits; Rule: each city must be split across all available reducers.",
          "Input: Irbid = 180 and Amman = 300; Output: (Irbid, 100) and (Amman, 200); Rule: all reducers write to local RAM.",
          "Input: SQL tables; Output: Python lists; Rule: all cities must be processed by a single Map task.",
          "Input: pairs from Map 1, Map 2, and Map 3; Output: Irbid [100, 50, 30] and Amman [200, 80, 20]; Rule: all values for the same city go to the same reducer."
        ],
        ans: 3,
        exp: "Slide 7 shows Shuffle taking the pairs from Map 1, Map 2, and Map 3, grouping them into Irbid [100, 50, 30] and Amman [200, 80, 20], and states: 'All values for the same city go to the same reducer.'"
      },
      {
        id: 8,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slide 7",
        type: "Conceptual Analysis",
        q: "Suppose a flawed distributed system violated the rule on Slide 7 ('All values for the same city go to the same reducer') and sent [100, 50] for Irbid to Reducer A while sending [30] for Irbid to Reducer B without any further aggregation. What would happen?",
        options: [
          "Both reducers would still output the correct total of 180 JOD for Irbid automatically.",
          "Neither reducer would have all contributions for the key 'Irbid', resulting in incomplete partial sums (150 and 30) instead of the true city total (180).",
          "HDFS would automatically merge the two reducers' disks using block replication.",
          "The Map tasks would re-read the InputSplits and sum the values before the Shuffle."
        ],
        ans: 1,
        exp: "Slides 6 & 7 explain that Shuffle must bring ALL contributions for the same key together ('All values for the same city go to the same reducer') so that the reducer can sum 100 + 50 + 30 = 180."
      },

      // Q9 - Q12: ans 3, 1, 0, 2
      {
        id: 9,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slide 8",
        type: "Pipeline Tracing",
        q: "According to Slide 8 ('Reduce: Sum the Values'), once the Shuffle stage delivers Irbid [100, 50, 30] and Amman [200, 80, 20], what does the Reduce stage do and where can the job write its final output?",
        options: [
          "It splits the arrays back into 6 individual pairs and writes them to YARN.",
          "It overwrites the input blocks inside sales.csv and deletes the original transaction records.",
          "It sends the arrays back to Map 1, Map 2, and Map 3 to verify the schema.",
          "It sums the grouped values for each city (Irbid: 100 + 50 + 30 = 180; Amman: 200 + 80 + 20 = 300), and the job can write its output files to HDFS."
        ],
        ans: 3,
        exp: "Slide 8 shows Reduce summing Irbid (100 + 50 + 30 -> Total = 180) and Amman (200 + 80 + 20 -> Total = 300), and notes at the bottom: 'The job can write its output files to HDFS.'"
      },
      {
        id: 10,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slide 9",
        type: "Conceptual Synthesis",
        q: "Slide 9 ('The Complete SUM Example') summarizes the entire distributed workflow in four concise statements. Which option states those exact four roles in their proper architectural order?",
        options: [
          "HDFS groups. Map stores blocks. Shuffle sums values. Reduce emits pairs.",
          "HDFS stores. Map emits pairs. Shuffle groups. Reduce sums.",
          "InputSplit stores. HDFS maps. Reduce shuffles. YARN sums.",
          "Map reads disk. Reduce groups keys. Shuffle adds totals. HDFS schedules."
        ],
        ans: 1,
        exp: "Slide 9 concludes the MapReduce section with the exact four-part summary: 'HDFS stores. Map emits pairs. Shuffle groups. Reduce sums.'"
      },
      {
        id: 11,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slides 2–9",
        type: "Identify the FALSE Statement",
        q: "Reviewing the complete MapReduce SUM example across Slides 2–9, which of the following statements is FALSE?",
        options: [
          "During the Map stage, Map 1, Map 2, and Map 3 communicate with each other to sum all Irbid sales before the Shuffle begins.",
          "In the example, sales.csv is stored across 3 HDFS blocks (Block 1 on Machine A, Block 2 on Machine B, Block 3 on Machine C).",
          "Each of the 3 Map tasks processes one InputSplit and emits two (city, sale amount) pairs.",
          "The Shuffle stage brings together [100, 50, 30] for Irbid and [200, 80, 20] for Amman so the Reduce stage can calculate 180 and 300."
        ],
        ans: 0,
        exp: "Map tasks run independently on their assigned InputSplits and simply emit (city, sale amount) pairs (Slide 5). Grouping contributions across Map tasks is the responsibility of Shuffle (Slides 6–7)."
      },
      {
        id: 12,
        topic: "MapReduce SUM & HDFS Blocks",
        slide: "Slides 5–9",
        type: "Quantitative & Pipeline Tracing",
        q: "Suppose a fourth block (Block 4 / InputSplit 4) was present in HDFS containing two additional rows: 'Irbid, 20' and 'Zarqa, 70'. Following the exact MapReduce logic of Slides 5–9, what would Map 4 emit, and what would the final Reduce output be?",
        options: [
          "Map 4 emits (Irbid, 200); final output is Irbid: 200, Amman: 300 (Zarqa is ignored because it only appears in one block).",
          "Map 4 emits (Zarqa, 90); final output is Irbid: 180, Amman: 300, Zarqa: 90.",
          "Map 4 emits (Irbid, 20) and (Zarqa, 70); Shuffle groups Irbid [100, 50, 30, 20], Amman [200, 80, 20], and Zarqa [70]; Reduce outputs Irbid: 200, Amman: 300, and Zarqa: 70.",
          "Map 4 fails because MapReduce can only group keys that appear in all four blocks."
        ],
        ans: 2,
        exp: "Following Slides 5–9: Map 4 emits (city, sale amount) pairs for its split -> (Irbid, 20) and (Zarqa, 70); Shuffle groups all values by key; Reduce sums each key's list (Irbid: 180 + 20 = 200, Amman: 300, Zarqa: 70)."
      },

      // Q13 - Q16: ans 1, 3, 0, 2
      {
        id: 13,
        topic: "Spark Roles, Driver & local[4]",
        slide: "Slide 10",
        type: "Deep Comparison",
        q: "Slide 10 ('Hadoop, HDFS and Spark: Different Roles') defines Hadoop as a collection of tools and contrasts it with Spark. How does Slide 10 specifically define the role of YARN compared to HDFS, MapReduce, and Spark?",
        options: [
          "YARN stores file blocks across computers, while HDFS allocates CPU and memory.",
          "YARN allocates CPU and memory to applications, while HDFS stores file blocks across computers, MapReduce processes data using map and reduce, and Spark is a processing engine that reads and analyzes data.",
          "YARN is a Python library for writing Spark SQL queries on local CSV files.",
          "YARN is a processing engine that calculates total sales for each city without using CPU or memory."
        ],
        ans: 1,
        exp: "Slide 10 explicitly defines each role: HDFS ('Stores file blocks across computers'), MapReduce ('Processes data using map and reduce'), YARN ('Allocates CPU and memory to applications'), and Spark ('A processing engine that reads and analyzes data')."
      },
      {
        id: 14,
        topic: "Spark Roles, Driver & local[4]",
        slide: "Slides 10 & 11",
        type: "Scenario Analysis",
        q: "A student wants to practice calculating total sales per city from sales.csv on a personal laptop using PySpark, while a company wants to run the same Spark logic across a 50-node cluster using HDFS and YARN. According to Slides 10 and 11, how does Spark support both scenarios?",
        options: [

    let userAnswers = {};
    let currentTopic = "ALL";
    let currentStatus = "ALL";

    function setTopic(topic, btn) {
      currentTopic = topic;
      document.querySelectorAll("#topicFilters .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      renderQuestions();
    }

    function setStatus(status, btn) {
      currentStatus = status;
      document.querySelectorAll("#statusFilters .chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      renderQuestions();
    }

    function selectAnswer(qId, optIdx) {
      if (userAnswers[qId] !== undefined) return;
      userAnswers[qId] = optIdx;
      updateStats();
      renderQuestions();
    }

    function retryQuestion(qId) {
      delete userAnswers[qId];
      updateStats();
      renderQuestions();
    }

    function resetAll() {
      userAnswers = {};
      updateStats();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateStats() {
      const answeredIds = Object.keys(userAnswers);
      let correct = 0;
      let wrong = 0;
      answeredIds.forEach(id => {
        const q = questions.find(item => item.id === Number(id));
        if (userAnswers[id] === q.ans) correct++;
        else wrong++;
      });
      const totalAns = answeredIds.length;
      const pct = totalAns > 0 ? Math.round((correct / totalAns) * 100) : 0;

      document.getElementById("stat-progress").textContent = `Answered: ${totalAns} / ${questions.length}`;
      document.getElementById("stat-correct").textContent = `Correct: ${correct}`;
      document.getElementById("stat-wrong").textContent = `Wrong: ${wrong}`;
      document.getElementById("stat-score").textContent = `Score: ${pct}%`;
    }

    function renderQuestions() {
      const container = document.getElementById("questionsContainer");
      const query = document.getElementById("searchBox").value.trim().toLowerCase();
      const letters = ["A", "B", "C", "D"];

      const filtered = questions.filter(q => {
        if (currentTopic !== "ALL" && q.topic !== currentTopic) return false;
        if (currentStatus === "UNANSWERED" && userAnswers[q.id] !== undefined) return false;
        if (currentStatus === "WRONG" && (userAnswers[q.id] === undefined || userAnswers[q.id] === q.ans)) return false;
        if (currentStatus === "FALSE_STMT" && q.type !== "Identify the FALSE Statement") return false;
        if (query) {
          const hay = (q.q + " " + q.topic + " " + q.slide + " " + q.type + " " + q.options.join(" ")).toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      container.innerHTML = filtered.map(q => {
        const chosen = userAnswers[q.id];
        const isAnswered = chosen !== undefined;
        const isCorrect = isAnswered && chosen === q.ans;
        const cardClass = isAnswered ? (isCorrect ? "q-card answered-correct" : "q-card answered-wrong") : "q-card";

        const optsHtml = q.options.map((optText, idx) => {
          let btnClass = "opt-btn";
          if (isAnswered) {
            if (idx === q.ans) btnClass += " correct-choice";
            else if (idx === chosen && chosen !== q.ans) btnClass += " wrong-choice";
          }
          return `
            <button class="${btnClass}" ${isAnswered ? "disabled" : ""} onclick="selectAnswer(${q.id}, ${idx})">
              <span class="opt-letter">${letters[idx]}</span>
              <span>${optText}</span>
            </button>
          `;
        }).join("");

        return `
          <div class="${cardClass}" id="q-card-${q.id}">
            <div class="q-meta">
              <span class="badge">Q${q.id} of 60</span>
              <span class="badge slide">${q.slide}</span>
              <span class="badge">${q.topic}</span>
              <span class="badge type">${q.type}</span>
            </div>
            <div class="q-text">${q.q}</div>
            <div class="options-list">
              ${optsHtml}
            </div>
            <div class="explanation-box ${isAnswered ? "visible" : ""}">
              <div class="exp-header ${isCorrect ? "pass" : "fail"}">
                <span>${isCorrect ? "✓ Correct! Deep Conceptual Match (Answer: " + letters[q.ans] + ")" : "✗ Incorrect — You chose " + (isAnswered ? letters[chosen] : "") + ", but the correct answer is " + letters[q.ans]}</span>
                <button class="retry-mini" onclick="retryQuestion(${q.id})">Retry Question</button>
              </div>
              <div><strong>Conceptual Explanation (${q.slide}):</strong> ${q.exp}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function downloadHTML() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "big_data_part2_deep_exam_60.html";
      a.click();
    }

    renderQuestions();
  </script>
